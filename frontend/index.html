<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>NewGenz Metaverse</title>
</head>
<body>
  <div id="app">
    <div id="authPanel">
      <h2>Enter the Metaverse</h2>

      <div id="authTabs">
        <button class="tab active" data-mode="login">Login</button>
        <button class="tab" data-mode="register">Register</button>
      </div>

      <form id="loginForm" class="authForm">
        <input type="text" name="login" placeholder="Username or email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>

      <form id="registerForm" class="authForm hidden">
        <input type="text" name="username" placeholder="Username" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Create Account</button>
      </form>

      <div id="authMessage"></div>
    </div>

    <div id="hud">
      <h1>NewGenz</h1>
      <div id="status">Loading world...</div>
      <button id="installButton" class="hidden">Install App</button>
      <button id="logoutButton" class="hidden">Logout</button>
    </div>

    <div id="worldPanel" class="hidden">
      <h3>Worlds</h3>
      <div id="worldList"></div>
    </div>

    <div id="avatarPanel">
      <h3>Avatar Styler</h3>
      <form id="avatarForm">
        <label>
          Skin tone
          <select id="skinTone">
            <option value="light">Light</option>
            <option value="tan">Tan</option>
            <option value="brown">Brown</option>
            <option value="dark">Dark</option>
          </select>
        </label>

        <label>
          Outfit color
          <select id="outfitColor">
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
            <option value="green">Green</option>
            <option value="red">Red</option>
            <option value="gold">Gold</option>
          </select>
        </label>

        <label>
          Style
          <select id="avatarStyle">
            <option value="classic">Classic</option>
            <option value="hero">Hero</option>
            <option value="street">Street</option>
            <option value="royal">Royal</option>
          </select>
        </label>

        <button type="submit">Save avatar</button>
      </form>
    </div>

    <div id="controlsHint">WASD move • Mouse look • Click to lock camera</div>

    <div id="chatPanel">
      <div id="chatMessages"></div>
      <form id="chatForm">
        <input id="chatInput" type="text" placeholder="Say something..." maxlength="200" />
        <button type="submit">Send</button>
      </form>
    </div>

    <canvas id="scene"></canvas>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
